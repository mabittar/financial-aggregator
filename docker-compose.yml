services:
  db:
    image: postgres:18.4
    container_name: pfa_postgres
    env_file:
      - infra/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_password}
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-aggregator}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
      # This runs the script to create the test user/db
      - ./infra/init_test_db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  redis:
    image: redis:8.10.0
    container_name: pfa_redis
    ports:
      - '6379:6379'
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
